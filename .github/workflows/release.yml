# Builds the desktop app for Linux, Windows and macOS (Intel and Apple Silicon) when a version tag such as
# v0.1.0 is pushed, and attaches the installers to a draft GitHub release for you to check and publish.
# Run it by hand from the Actions tab to get the installers as build artifacts without a release.
name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04      # the oldest supported Ubuntu, so the AppImage runs on older Linux too
            target: --linux AppImage deb --x64
          - os: windows-2022
            target: --win nsis --x64
          - os: macos-15-intel
            target: --mac dmg --x64
          - os: macos-15
            target: --mac dmg --arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bundle the Python server
        run: |
          python -m pip install -r requirements.txt pyinstaller==6.22.3
          python desktop/build_server.py
          python desktop/smoke_server.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Build the app
        working-directory: desktop
        run: |
          npm ci
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"; fi
          npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: podroom-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.exe
            desktop/dist/*.dmg

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes \
            --title "Podroom ${GITHUB_REF_NAME#v}"
